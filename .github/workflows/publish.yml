# Publish this repository's products: fetch with the site's pipelines,
# validate against its own contract, and publish one build to Cloudflare R2
# alone: no Pages site (the site pipeline's D13). Written by the site's pipeline/scaffold/new-origin.py
# from the sibling data repositories' workflow.
#
# **Dispatch-only until a dispatched run has published a tree**: prove the
# pipeline, THEN uncomment the schedule below, in the same commit as the docs.
# `status/status.json` reports `schedule: null` until then, and the site's
# watchdog names an origin with no schedule on sight.
#
# Needs, from the owner: `PIPELINES_SSH_KEY` (this repository's read-only
# deploy key on oceansensing.github.io) and the organization's R2_* secrets.

name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the probe says the tree is current'
        type: boolean
        default: false
      # **A dispatch's `due` names steps whose source is read now** whatever their interval (the names, the
      # borders, the areas and the EEZ boundaries are made monthly): `due=borders`, `due=areas`, `due=eez`,
      # `due=names,borders` or `due=all`.
      due:
        description: 'Steps due now whatever their interval (a comma list, or all)'
        type: string
        default: ''
  # Daily since 2026-11-11, the first dispatched run read (43146399308: 64,580 names, fresh); the build itself once
  # in 720 hours (`every_hours`), so a month whose sources were down is made the next day.
  schedule:
    - cron: '23 5 * * *'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      behind: ${{ steps.run.outputs.behind }}
    steps:
      # This repository first: actions/checkout cleans its destination, so
      # taking the root after the others would wipe them.
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the pipelines
        id: pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Say why the pipelines could not be checked out
        if: failure() && steps.pipelines.outcome == 'failure'
        run: |
          echo "::error title=Cannot read the pipelines::Could not check out oceansensing/oceansensing.github.io. Read the step log first - the causes look alike."
          echo "::error title=If the log says 'error in libcrypto'::The key could not be PARSED - almost always a missing trailing newline on PIPELINES_SSH_KEY. Re-paste the whole file (pbcopy < keyfile), or set it with gh secret set < keyfile."
          echo "::error title=If the log says only 'Permission denied (publickey)'::The public half is missing from the site repository's Deploy keys page, was revoked, or does not match."
          echo "::error title=If the log says 'Repository not found'::The secret is unset or empty, so the checkout fell back to GITHUB_TOKEN, which holds no grant on the site repository."
      - name: Check out the last publish
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: published
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install what the fetchers need
        run: pip install --no-cache-dir -r site/scripts/requirements-names.txt
      - name: Unit-test the orchestrator
        working-directory: site
        run: python3 pipeline/test_orchestrate.py
      - name: Self-test fetch-names.py
        run: python3 site/scripts/fetch-names.py --self-test
      - name: Self-test check-names.py
        run: python3 site/scripts/check-names.py --self-test
      - name: Seed the stage from the last publish
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py seed
      # **The borders' tree as last published, from the cache, under the version its root names** (2026-11-12): the
      # branch keeps the root alone, and a tree the stage lacks would be published absent — so the run would not
      # deploy (`guard_trees`). A cache that misses costs one build: the fetcher makes the borders again when the
      # stage lacks the version its root names.
      - name: The published borders' version
        id: tree
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" published/map/district-borders.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Restore the borders' tiles
        id: borders-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/district-borders
          key: land-district-borders-${{ steps.tree.outputs.version }}
      # **And the areas' tree** (2026-11-12), the same way: its root names its version, the cache holds its tiles.
      - name: The published areas' version
        id: areas-tree
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" published/map/district-areas.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Restore the areas' tiles
        id: areas-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/district-areas
          key: land-district-areas-${{ steps.areas-tree.outputs.version }}
      # **And the EEZ boundaries' tree** (2026-11-13), the same way.
      - name: The published EEZ boundaries' version
        id: eez-tree
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" published/map/eez-boundaries.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Restore the EEZ boundaries' tiles
        id: eez-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/eez-boundaries
          key: land-eez-boundaries-${{ steps.eez-tree.outputs.version }}
      - name: Plan the run
        id: plan
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py plan --mode full
      - name: Fetch, validate, assemble
        id: run
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          PIPELINE_DUE_NOW: ${{ inputs.due }}
        run: python3 site/pipeline/orchestrate.py run
      # A set this run made anew is saved under its own version, for the next run to restore — and so is one its
      # restore missed, or every run after the cache was evicted would miss it again and build it again.
      - name: Name the borders' set on the stage
        id: set
        if: always()
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" site/public/map/land/district-borders/index.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Save the borders' tiles
        if: steps.run.outputs.deploy == 'true' && steps.set.outputs.version != 'none' && (steps.set.outputs.version != steps.tree.outputs.version || steps.borders-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/district-borders
          key: land-district-borders-${{ steps.set.outputs.version }}
      - name: Name the areas' set on the stage
        id: areas-set
        if: always()
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" site/public/map/land/district-areas/index.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Save the areas' tiles
        if: steps.run.outputs.deploy == 'true' && steps.areas-set.outputs.version != 'none' && (steps.areas-set.outputs.version != steps.areas-tree.outputs.version || steps.areas-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/district-areas
          key: land-district-areas-${{ steps.areas-set.outputs.version }}
      - name: Name the EEZ boundaries' set on the stage
        id: eez-set
        if: always()
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" site/public/map/land/eez-boundaries/index.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Save the EEZ boundaries' tiles
        if: steps.run.outputs.deploy == 'true' && steps.eez-set.outputs.version != 'none' && (steps.eez-set.outputs.version != steps.eez-tree.outputs.version || steps.eez-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/eez-boundaries
          key: land-eez-boundaries-${{ steps.eez-set.outputs.version }}
      - name: Upload the build
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: out
          retention-days: 1
      - name: Upload the branch content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-out
          path: branch-out
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the branch content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branch-out
          path: branch-out
      - name: Publish the branch
        run: |
          cd branch-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:published

  # R2 alone (the site pipeline's D13).
  publish-r2:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The publish, and beside it the writer it packs a tile set into one
      # archive with (scripts/tile_archive.py).
      - name: Check out the publish script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          path: code
          sparse-checkout: |
            pipeline
            scripts
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: site
      - name: Test the publish script
        run: python3 code/pipeline/test_publish_r2.py
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 code/pipeline/publish_r2.py site "$GITHUB_REPOSITORY" --r2-only
