# What this repository publishes: the names of land and water and their administrative context, as label
# points — each name with the zoom it is named from — in one file, `names.json`: Natural Earth's oceans,
# seas, countries, capitals, cities, states and provinces, land regions, peaks, lakes and rivers; GeoNames'
# undersea features; the U.S. Census Bureau's counties; geoBoundaries' second-level areas where each
# country's own license allows commercial use. The fetcher is the site's `scripts/fetch-names.py` and the
# contract its `scripts/check-names.py`: no file the website's map reads, so `test-schema.mjs` does not
# describe it.
#
# **Once a month** (`every_hours = 720`), the schedule asking daily so a month whose sources were down is
# made the next day: the sources change by the year, GeoNames by the day but its sea floor seldom. A run
# fetches about 700 MB — GeoNames' whole dump the most of it — and builds in under a minute.
#
# **And the districts' and counties' borders** (2026-11-12, `borders`): the edges two of the areas the names
# name share — the Census's counties and the districts of each country kept — never a coast or a country's
# outer edge. A root, `district-borders.json`, names a version of the tree `land/district-borders/`: two tiers
# of line tiles (simplified, 20°, to zoom 9; the sources' detail, 5°, from it), about 77 MB at the first build,
# 99,800 lines, 695 tiles (2026-11-12, this Mac's build). **The tree is carried between runs by the
# workflow's cache**, never the branch; the step runs every run and its fetcher makes the borders again only
# when due — once a month, where the stage lacks the version the root names (a cache missed), or asked by a
# dispatch (`due=borders`) — fetching about 300 MB (geoBoundaries and the Census, not GeoNames).
#
# **And the named areas' outlines** (2026-11-12, `areas`): each area the names name — its outline simplified to
# 0.002° (about 220 m), with its name, its country's term for it and its state or province — so a reader can say
# which district or county a point is in. A root, `district-areas.json`, names a version of the tree
# `land/district-areas/`: 5° tiles, 678 of them and 63 MB at the first build (35,785 areas). Made by the borders'
# step from the same download, due on its own (monthly, its version missing from the stage, or `due=areas`), its tree
# carried by the workflow's cache as the borders' is.
#
# **And the EEZ boundaries** (2026-11-13, `eez`): every line of Marine Regions' Maritime Boundaries Geodatabase
# (`eez_boundaries`, Flanders Marine Institute, CC BY 4.0), the baselines included, each classed by its type — a
# zone's limit, a boundary, a joint regime, a line in dispute, a baseline, a connection line. A root,
# `eez-boundaries.json`, names a version of the tree `land/eez-boundaries/`: three tiers of line tiles (the world in
# 90° tiles to zoom 4, 30° tiles from 4 to 8, the source's detail in 10° tiles from 8), about 16 MB, 2,349 lines, 443
# tiles (2026-11-13, measured). Made monthly by a step of its own, from one 25 MB request to Marine Regions' WFS; the
# tree carried by the workflow's cache as the borders' is; R2 alone, as all of this repository is.

[contract]
check = ["python3", "scripts/check-names.py"]
roots = ["python3", "scripts/check-names.py", "--roots"]

[defaults]
timeout_minutes = 20

[steps.names]
cmd = ["python3", "scripts/fetch-names.py", "--only=names"]
lane = "download.geonames.org"
timeout_minutes = 60
every_hours = 720

[steps.borders]
cmd = ["python3", "scripts/fetch-names.py", "--only=borders,areas"]
lane = "www.geoboundaries.org"
timeout_minutes = 60

[steps.eez]
cmd = ["python3", "scripts/fetch-names.py", "--only=eez"]
lane = "geo.vliz.be"
timeout_minutes = 20

[products.names]
title = "The names of land and water and their administrative context, as label points with the zoom each is named from (Natural Earth, GeoNames, the U.S. Census Bureau, geoBoundaries)"
step = "names"
roots = ["names.json"]
writes = ["names.json"]
namespace = ["python3", "scripts/fetch-names.py", "--namespace", "--only=names"]
max_age_hours = 840

[products.borders]
title = "The districts' and counties' borders: the edges two of the named areas share, in two tiers of line tiles (geoBoundaries, the U.S. Census Bureau)"
step = "borders"
roots = ["district-borders.json"]
writes = ["district-borders.json"]
namespace = ["python3", "scripts/fetch-names.py", "--namespace", "--only=borders"]
trees = ["land/district-borders"]
max_age_hours = 840

[products.areas]
title = "The named areas' outlines: each district's and county's outline with its name, its country's term for it and its state or province, in 5° tiles (geoBoundaries, the U.S. Census Bureau)"
step = "borders"
roots = ["district-areas.json"]
writes = ["district-areas.json"]
namespace = ["python3", "scripts/fetch-names.py", "--namespace", "--only=areas"]
trees = ["land/district-areas"]
max_age_hours = 840

[products.eez]
title = "The EEZ boundaries: every line of the Maritime Boundaries Geodatabase, each classed by its type, in three tiers of line tiles (Flanders Marine Institute, MarineRegions.org)"
step = "eez"
roots = ["eez-boundaries.json"]
writes = ["eez-boundaries.json"]
namespace = ["python3", "scripts/fetch-names.py", "--namespace", "--only=eez"]
trees = ["land/eez-boundaries"]
max_age_hours = 840
